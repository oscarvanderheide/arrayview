name: Launch contracts

on:
  pull_request:
    paths:
      - src/arrayview/**
      - tests/**
      - vscode-extension/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/launch-contracts.yml
  push:
    branches: [main]
    paths:
      - src/arrayview/**
      - tests/**
      - vscode-extension/**
      - pyproject.toml
      - uv.lock
      - .github/workflows/launch-contracts.yml

permissions:
  contents: read

jobs:
  planner-and-lifecycle:
    strategy:
      fail-fast: false
      matrix:
        # Windows is not covered. The job never passed: the launch paths have
        # real Windows defects (console entry point resolved without .exe, two
        # launch-trace failures, a node contract test, an ipykernel test) plus a
        # stray console interrupt ~15s in. A job that always fails teaches
        # nothing, so it is out until someone ports those paths deliberately.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: uv sync --frozen --group dev --group test
      - name: Install Playwright browser
        run: uv run playwright install chromium
      - name: Python launch checks
        run: >-
          uv run pytest
          tests/test_instance_registry.py
          tests/test_safe_server_stop.py
          tests/test_cli.py
          tests/test_vsix_bundle.py
          tests/test_launch_blackbox.py
          -q
      - name: VS Code extension helpers
        run: |
          node vscode-extension/test_lifecycle_helpers.js
          node vscode-extension/test_viewer_websocket_hedge.js
      - name: VS Code extension syntax
        run: node --check vscode-extension/extension.js
